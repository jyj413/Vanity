<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vanity — Beauty Tracker</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B97D8B">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap');

:root{
  --bg: #FAF3EE;
  --surface: #FFFFFF;
  --surface-alt: #F4E7DF;
  --pink: #D9A7B2;
  --pink-deep: #B97D8B;
  --pink-pale: #F2DEE2;
  --text: #4A3B36;
  --text-soft: #93807A;
  --border: #EAD9CF;
  --amber: #C79355;
  --red: #BD6B62;
  --shadow: 0 2px 10px rgba(90, 60, 50, 0.07);
}
*{ box-sizing: border-box; }
body{
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Work Sans', sans-serif;
  -webkit-tap-highlight-color: transparent;
}
#app{ max-width: 560px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 100px; }

/* Topbar */
.topbar{
  position: sticky; top:0; z-index: 20;
  background: var(--bg);
  padding: 22px 18px 10px;
}
.brand{
  font-family:'Fraunces', serif;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 0.2px;
  margin: 0;
  color: var(--text);
}
.brand span{ color: var(--pink-deep); }
.brand-row{
  display:flex; align-items:center; justify-content: space-between;
  margin-bottom: 14px;
}
.icon-btn{
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-soft); font-size: 18px; line-height:0;
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:disabled{ opacity: 0.35; }
.toast{
  position: fixed; left: 50%; bottom: 100px;
  transform: translateX(-50%);
  background: var(--text); color: #fff;
  font-size: 13px; font-weight: 500;
  padding: 10px 18px; border-radius: 20px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.2);
  z-index: 60; opacity: 0; transition: opacity 0.2s ease;
  pointer-events: none; white-space: nowrap;
}
.toast.show{ opacity: 0.94; }

#photoMenuOverlay{ z-index: 65; }
#scannerOverlay{ z-index: 70; }
.action-icon svg{ width: 18px; height: 18px; }
.scanner-box{
  background: var(--bg);
  width: 100%; max-width: 560px;
  border-radius: 22px 22px 0 0;
  padding: 8px 18px 22px;
  display:flex; flex-direction:column; align-items:center; gap: 12px;
}
#qr-reader{
  width: 100%; border-radius: 14px; overflow:hidden; background:#000;
  min-height: 220px;
}
.scanner-status{
  font-size: 13px; color: var(--text-soft); text-align:center; min-height: 18px;
  padding: 0 10px;
}

.storage-banner{
  background: #F3E4CE; color: var(--amber);
  font-size: 12px; font-weight: 500;
  padding: 8px 12px; border-radius: 10px;
  margin-bottom: 12px;
}
.storage-banner.hidden{ display:none; }

.crumbs{
  display:flex; align-items:center; flex-wrap: wrap; gap: 4px;
  font-size: 13.5px;
  color: var(--text-soft);
  min-height: 20px;
}
.crumbs .crumb{ cursor:pointer; }
.crumbs .crumb.current{ color: var(--text); font-weight: 600; }
.crumbs .sep{ color: var(--pink); padding: 0 2px; }

.toolrow{
  display:flex; flex-direction: column; gap: 8px;
  margin-top: 10px;
}
.toolrow-line{ display:flex; justify-content: space-between; align-items:center; gap: 8px; }
.count-label{ font-size: 12px; color: var(--text-soft); }
.view-toggle{
  display:flex; border: 1px solid var(--border); border-radius: 20px;
  overflow: hidden; background: var(--surface); flex-shrink:0;
}
.view-btn{
  border:none; background: transparent; color: var(--text-soft);
  font-size: 14px; width: 32px; height: 30px;
  display:flex; align-items:center; justify-content:center;
}
.view-btn.active{ background: var(--pink-deep); color: #fff; }
.sort-btn, .filter-btn{
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'Work Sans', sans-serif;
  font-size: 12.5px;
  padding: 6px 11px;
  border-radius: 20px;
  display:flex; align-items:center; gap:5px;
  white-space: nowrap;
}
.filter-btn.active{ background: var(--pink-pale); border-color: var(--pink); color: var(--pink-deep); font-weight:600; }
.sort-filter-row{ display:flex; gap: 8px; overflow-x:auto; }

/* Grid */
.grid{
  padding: 14px 18px 30px;
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.grid.list-view{
  grid-template-columns: 1fr;
}
.list-view .folder-tile{
  flex-direction: row; align-items: center; padding: 14px; gap: 14px;
}
.list-view .folder-icon, .list-view .folder-icon-svg{ flex-shrink: 0; }
.list-view .product-tile{
  flex-direction: row; align-items: stretch;
}
.list-view .product-photo{
  width: 84px; height: 84px; aspect-ratio: unset; flex-shrink: 0;
}
.list-view .product-photo.placeholder{ font-size: 22px; }
.list-view .product-body{
  padding: 10px 14px; justify-content: center; gap: 4px;
}
.tile{
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border);
}
.folder-tile{
  padding: 16px 14px;
  display:flex; flex-direction: column; gap: 10px;
  background: var(--surface-alt);
  cursor: pointer;
}
.folder-icon{
  width: 34px; height: 26px;
  background: var(--pink);
  border-radius: 4px 8px 8px 8px;
  position: relative;
}
.folder-icon::before{
  content:''; position:absolute; left:0; top:-6px;
  width: 16px; height: 8px; background: var(--pink);
  border-radius: 4px 4px 0 0;
}
.folder-icon-svg{
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--pink-pale); color: var(--pink-deep);
  display:flex; align-items:center; justify-content:center;
  flex-shrink: 0;
}
.folder-icon-svg svg{ width: 20px; height: 20px; }
.folder-name{ font-weight: 600; font-size: 14.5px; line-height:1.25; }
.folder-meta{ font-size: 11.5px; color: var(--text-soft); }
.tile-menu-btn{
  position:absolute; top: 8px; right: 8px;
  width: 26px; height:26px; border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  color: var(--text-soft); font-size: 16px;
  background: rgba(255,255,255,0.6);
}

.product-tile{ cursor: pointer; display:flex; flex-direction:column; }
.product-photo{
  width: 100%; aspect-ratio: 1/1; object-fit: cover;
  background: var(--surface-alt);
  display:block;
}
.product-photo.placeholder{
  display:flex; align-items:center; justify-content:center;
  color: var(--pink-deep); font-size: 26px;
  font-family:'Fraunces', serif;
}
.product-body{ padding: 10px 12px 12px; display:flex; flex-direction:column; gap:5px; }
.product-name{ font-size: 14px; font-weight: 600; line-height:1.25; }
.product-sub{ font-size: 11.5px; color: var(--text-soft); }
.badge{
  align-self: flex-start;
  font-size: 10.5px; font-weight: 600;
  padding: 3px 8px; border-radius: 20px;
  margin-top: 2px;
}
.badge.ok{ background: var(--pink-pale); color: var(--pink-deep); }
.badge.soon{ background: #F3E4CE; color: var(--amber); }
.badge.expired{ background: #F1DAD7; color: var(--red); }
.updated-label{ font-size: 10px; color: var(--text-soft); opacity: 0.75; margin-top: 2px; }

.empty-state{
  grid-column: 1/-1;
  text-align:center;
  padding: 60px 20px;
  color: var(--text-soft);
}
.empty-state .big{
  font-family:'Fraunces', serif;
  font-size: 19px;
  color: var(--text);
  margin-bottom: 6px;
}

/* FAB */
.fab{
  position: fixed; bottom: 26px;
  right: max(24px, calc(50% - 256px));
  width: 58px; height: 58px;
  border-radius: 50%;
  background: var(--pink-deep);
  color: #fff;
  font-size: 30px;
  border: none;
  box-shadow: 0 6px 18px rgba(185, 125, 139, 0.45);
  display:flex; align-items:center; justify-content:center;
  z-index: 30;
  line-height: 0;
  padding-bottom: 3px;
}

/* Overlay / Sheets */
.overlay{
  position: fixed; inset:0; background: rgba(74,59,54,0.35);
  z-index: 50; display:flex; align-items:flex-end; justify-content:center;
}
.overlay.hidden{ display:none; }
.sheet{
  background: var(--bg);
  width: 100%; max-width: 560px;
  border-radius: 22px 22px 0 0;
  padding: 8px 18px 18px;
  max-height: 92vh; overflow-y: auto;
  animation: rise 0.22s ease-out;
}
@keyframes rise{ from{ transform: translateY(30px); opacity:0;} to{ transform: translateY(0); opacity:1;} }
.sheet-handle{
  width: 36px; height: 4px; background: var(--border);
  border-radius: 4px; margin: 6px auto 10px;
}
.sheet-title{ font-family:'Fraunces', serif; font-size: 17px; font-weight:600; margin: 0 0 10px; }

.action-item{
  display:flex; align-items:center; gap: 12px;
  padding: 11px 4px; font-size: 14px; font-weight: 500;
  border-bottom: 1px solid var(--border);
}
.action-item:last-child{ border-bottom: none; }
.action-icon{
  width: 32px; height: 32px; border-radius: 9px;
  background: var(--pink-pale); color: var(--pink-deep);
  display:flex; align-items:center; justify-content:center; font-size: 15px;
}

label.field-label{
  display:block; font-size: 11px; font-weight: 600;
  color: var(--text-soft); margin: 9px 0 4px;
}
input[type=text], input[type=search], input[type=date], textarea, select{
  -webkit-appearance: none;
  appearance: none;
  width: 100%; padding: 8px 11px;
  border: 1px solid var(--border); border-radius: 11px;
  background: var(--surface);
  font-family: 'Work Sans', sans-serif; font-size: 13px;
  color: var(--text);
}
textarea{ min-height: 44px; resize: vertical; }
.date-row{ display:flex; gap: 10px; }
.date-row > div{ flex:1; }

.photo-row{ display:flex; align-items:center; gap: 12px; margin-top: 2px; }
.photo-picker{
  width: 76px; height: 76px; flex-shrink: 0; border-radius: 14px;
  border: 1.5px dashed var(--pink);
  background: var(--surface-alt);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 2px; color: var(--pink-deep); font-size: 9.5px; font-weight: 500;
  overflow:hidden; position:relative;
}
.photo-picker img{ width:100%; height:100%; object-fit: cover; position:absolute; inset:0; }
.photo-picker .plus-icon{ font-size: 18px; line-height: 1; }
.photo-hint{ font-size: 12px; color: var(--text-soft); }

.sheet-actions{ display:flex; gap: 10px; margin-top: 14px; }
.btn{
  flex:1; padding: 11px; border-radius: 11px; border:none;
  font-family:'Work Sans', sans-serif; font-weight:600; font-size: 13.5px;
}
.btn-primary{ background: var(--pink-deep); color: #fff; }
.btn-secondary{ background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-danger{ background: var(--surface); color: var(--red); border: 1px solid var(--border); }

.sort-options .action-item{ cursor:pointer; justify-content: space-between; }
.sort-options .check{ color: var(--pink-deep); font-weight:700; visibility:hidden; }
.sort-options .active .check{ visibility: visible; }

.toggle-row{
  display:flex; align-items:center; justify-content: space-between;
  padding: 10px 12px; font-size: 13.5px; font-weight: 500;
  color: var(--text);
  background: var(--surface-alt);
  border: 1px solid var(--pink);
  border-radius: 12px;
  margin: 10px 0 4px;
}
.toggle-switch{
  width: 40px; height: 24px; border-radius: 20px;
  background: var(--border); position: relative; flex-shrink:0;
  border: none; cursor:pointer;
}
.toggle-switch::after{
  content:''; position:absolute; top:3px; left:3px;
  width:18px; height:18px; border-radius:50%; background:#fff;
  transition: left 0.15s ease;
}
.toggle-switch.on{ background: var(--pink-deep); }
.toggle-switch.on::after{ left: 19px; }
.badge.using{ background: var(--pink-deep); color: #fff; }

.icon-picker{
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 4px;
}
.icon-swatch{
  width: 100%; aspect-ratio: 1/1; border-radius: 12px;
  border: 1.5px solid var(--border); background: var(--surface-alt);
  color: var(--pink-deep); display:flex; align-items:center; justify-content:center;
  padding: 0;
}
.icon-swatch svg{ width: 20px; height: 20px; }
.icon-swatch.selected{ border-color: var(--pink-deep); background: var(--pink-pale); }
.icon-swatch .no-icon-mark{ width: 14px; height: 1.6px; background: var(--text-soft); border-radius: 1px; transform: rotate(-45deg); }

input[type=text].filter-days-input{
  width: 90px; padding: 4px 6px; text-align:center;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; background: var(--surface); color: var(--text);
  flex-shrink: 0;
}
.filter-days-row{
  flex-wrap: nowrap; gap: 6px;
}
.filter-days-label{
  white-space: nowrap; flex-shrink: 0; overflow: visible;
}
.filter-days-row .check{ margin-left: auto; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand-row">
      <h1 class="brand">Vanity<span>.</span></h1>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="undoBtn" aria-label="Undo last change" disabled>↺</button>
        <button class="icon-btn" id="redoBtn" aria-label="Redo last change" disabled>↻</button>
        <button class="icon-btn" id="menuBtn" aria-label="Backup and restore">⋯</button>
      </div>
    </div>
    <div class="storage-banner hidden" id="storageBanner">Your browser is blocking storage (private browsing or storage is full) — changes won't be saved.</div>
    <div class="crumbs" id="crumbs"></div>
    <div class="toolrow">
      <div class="toolrow-line">
        <div class="count-label" id="countLabel"></div>
        <div class="view-toggle" id="viewToggle">
          <button class="view-btn" data-view="grid" id="gridViewBtn" aria-label="Grid view">⊞</button>
          <button class="view-btn" data-view="list" id="listViewBtn" aria-label="List view">☰</button>
        </div>
      </div>
      <div class="toolrow-line sort-filter-row">
        <button class="sort-btn" id="sortBtn">⇅ <span id="sortLabel">Recently added</span></button>
        <button class="filter-btn" id="filterBtn">⚲ <span id="filterLabel">Filter</span></button>
      </div>
    </div>
  </div>
  <main class="grid" id="grid"></main>
  <button class="fab" id="fabBtn">+</button>
</div>
<div class="overlay hidden" id="overlay"></div>
<div class="overlay hidden" id="photoMenuOverlay"></div>
<div class="overlay hidden" id="scannerOverlay"></div>
<div class="toast" id="toast"></div>

<script>
const overlay = document.getElementById('overlay');
const photoMenuOverlay = document.getElementById('photoMenuOverlay');
const scannerOverlay = document.getElementById('scannerOverlay');
const gridEl = document.getElementById('grid');
const crumbsEl = document.getElementById('crumbs');
const countLabel = document.getElementById('countLabel');
const sortLabelEl = document.getElementById('sortLabel');
const filterLabelEl = document.getElementById('filterLabel');
const filterBtnEl = document.getElementById('filterBtn');

let folders = [];   // {id, name, parentId, icon}
let products = [];  // {id, name, folderId, image, quantity, inUse, purchaseDate, mfgDate, expDate, notes, createdAt, updatedAt}
let currentFolderId = null;
let sortMode = 'added';
let viewMode = 'grid';
let filterMode = { type: 'all', days: 14, scope: 'direct' };
const SORT_LABELS = {
  added: 'Recently added',
  name: 'Name A–Z',
  expiry: 'Expiring soonest',
  purchased: 'Recently purchased'
};

// Minimalist line-icon set for the default category folders — plain strokes,
// no fill, matching the app's understated feminine look.
const FOLDER_ICONS = {

  sc_moisturizers: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7.5" y="10" width="9" height="8" rx="2"/><rect x="7" y="7.5" width="10" height="3" rx="1.2"/></svg>`,
  sc_sunscreen: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.5 6.5l1.4 1.4M16.1 16.1l1.4 1.4M6.5 17.5l1.4-1.4M16.1 7.9l1.4-1.4"/></svg>`,

// ---------- Storage ----------
// Prefers Claude's artifact storage (window.storage) when available, e.g.
// while previewing inside Claude. Once this file is hosted on its own
// (like on GitHub Pages) window.storage won't exist, so it falls back to
// the browser's localStorage, which persists per-visitor on that domain.
let storagePersistent = true;
const LS_PREFIX = 'vanity-tracker:';

function showStorageWarning(){
  if(!storagePersistent) return;
  storagePersistent = false;
  const banner = document.getElementById('storageBanner');
  if(banner) banner.classList.remove('hidden');
}

const localStorageAPI = {
  async get(key, shared){
    const raw = localStorage.getItem(LS_PREFIX + key);
    if(raw === null) throw new Error('not found');
    return { key, value: raw, shared: !!shared };
  },
  async set(key, value, shared){
    localStorage.setItem(LS_PREFIX + key, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    localStorage.removeItem(LS_PREFIX + key);
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared){
    const p = LS_PREFIX + (prefix || '');
    const keys = [];
    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(p)) keys.push(k.slice(LS_PREFIX.length));
    }
    return { keys, shared: !!shared };
  }
};

function hasClaudeStorage(){
  return !!(window.storage && typeof window.storage.set === 'function');
}

const storageAPI = {
  async get(key, shared){
    if(hasClaudeStorage()){
      try{ return await window.storage.get(key, shared); }
      catch(e){ /* fall through to localStorage */ }
    }
    return localStorageAPI.get(key, shared);
  },
  async set(key, value, shared){
    if(hasClaudeStorage()){
      try{
        const r = await window.storage.set(key, value, shared);
        if(r) return r;
      }catch(e){ /* fall through to localStorage */ }
    }
    try{
      return await localStorageAPI.set(key, value, shared);
    }catch(e){
      showStorageWarning();
      return null;
    }
  },
  async delete(key, shared){
    if(hasClaudeStorage()){
      try{ await window.storage.delete(key, shared); }catch(e){}
    }
    try{ return await localStorageAPI.delete(key, shared); }catch(e){ return null; }
  },
  async list(prefix, shared){
    if(hasClaudeStorage()){
      try{ return await window.storage.list(prefix, shared); }catch(e){}
    }
    return localStorageAPI.list(prefix, shared);
  }
};

  try{
    const r = await storageAPI.get(key, false);
    return r ? r.value : null;
  }catch(e){ return null; }
}

// ---------- Undo / Redo ----------
// Before any mutating action, we snapshot the current folders/products so the
// person can step back (and then forward again) through recent changes.
const undoStack = [];
const redoStack = [];
const HISTORY_LIMIT = 5;

function snapshotState(){
  return JSON.parse(JSON.stringify({ folders, products }));
}
function pushUndo(){
  undoStack.push(snapshotState());
  if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
  redoStack.length = 0; // a fresh change invalidates any redo history
  updateHistoryButtons();
}
function updateHistoryButtons(){
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  if(undoBtn) undoBtn.disabled = undoStack.length === 0;
  if(redoBtn) redoBtn.disabled = redoStack.length === 0;
}
let toastTimer = null;
function showToast(msg){
  const toast = document.getElementById('toast');
  if(!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove('show'), 1800);
}

// ---------- Barcode scanning ----------
// The scanning library is only fetched the first time someone actually taps
// "Scan Barcode", so the app stays fast for everyone who never uses it.
let scannerLibPromise = null;
function ensureScannerLibLoaded(){
  if(window.Html5Qrcode) return Promise.resolve();
  if(scannerLibPromise) return scannerLibPromise;
  scannerLibPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
    s.onload = ()=> resolve();
    s.onerror = ()=> { scannerLibPromise = null; reject(new Error('load-failed')); };
    document.head.appendChild(s);
  });
  return scannerLibPromise;
}

let activeScanner = null;
async function openBarcodeScanner({ onResult }){
  scannerOverlay.innerHTML = `
    <div class="scanner-box">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Scan Barcode</div>
      <div id="qr-reader"></div>
      <div class="scanner-status" id="scannerStatus">Loading scanner…</div>
      <button type="button" class="btn btn-secondary" id="scannerCancelBtn" style="width:100%;">Cancel</button>
    </div>
  `;
  scannerOverlay.classList.remove('hidden');
  const statusEl = document.getElementById('scannerStatus');
  let stopped = false;

  async function stopAndClose(){
    if(stopped) return;
    stopped = true;
    if(activeScanner){
      try{ await activeScanner.stop(); }catch(e){}
      try{ activeScanner.clear(); }catch(e){}
      activeScanner = null;
    }
    scannerOverlay.classList.add('hidden');
    scannerOverlay.innerHTML = '';
  }
  document.getElementById('scannerCancelBtn').onclick = stopAndClose;

  try{
    await ensureScannerLibLoaded();
  }catch(loadErr){
    statusEl.textContent = "Couldn't load the scanner. Check your connection and try again.";
    return;
  }
  if(stopped) return;

  statusEl.textContent = 'Point your camera at the barcode';
  try{
    activeScanner = new Html5Qrcode('qr-reader');
    await activeScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 160 } },
      async (decodedText)=>{
        if(stopped) return;
        await stopAndClose();
        onResult(decodedText);
      },
      ()=>{ /* per-frame miss, ignore */ }
    );
  }catch(camErr){
    statusEl.textContent = 'Could not access the camera. Check camera permission for this site in Settings.';
  }
}

// Fetches an (often cross-origin) product photo and returns it as a resized
// base64 JPEG, the same format used for photos picked from the device.
async function fetchImageAsResizedDataUrl(url, maxW=600){
  const resp = await fetch(url, { mode: 'cors' });
  if(!resp.ok) throw new Error('image fetch failed');
  const blob = await resp.blob();
  const objectUrl = URL.createObjectURL(blob);
  try{
    return await new Promise((resolve, reject)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = ()=> reject(new Error('image decode failed'));
      img.src = objectUrl;
    });
  } finally {
    URL.revokeObjectURL(objectUrl);
  }
}

async function persistFullState(priorProductIds){
  const keepIds = new Set(products.map(p=>p.id));
  for(const id of priorProductIds){
    if(!keepIds.has(id)) await deleteProductStorage(id);
  }
  for(const p of products){ await saveProduct(p); }
  await saveProductIndex();
  await saveFolders();
}
async function undoLast(){
  if(undoStack.length === 0) return;
  const priorProductIds = products.map(p=>p.id);
  redoStack.push(snapshotState());
  if(redoStack.length > HISTORY_LIMIT) redoStack.shift();
  const snap = undoStack.pop();
  folders = snap.folders;
  products = snap.products;
  if(!folders.find(f=>f.id===currentFolderId)) currentFolderId = null;
  await persistFullState(priorProductIds);
  updateHistoryButtons();
  render();
  showToast('Undid last change');
}
async function redoLast(){
  if(redoStack.length === 0) return;
  const priorProductIds = products.map(p=>p.id);
  undoStack.push(snapshotState());
  if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
  const snap = redoStack.pop();
  folders = snap.folders;
  products = snap.products;
  if(!folders.find(f=>f.id===currentFolderId)) currentFolderId = null;
  await persistFullState(priorProductIds);
  updateHistoryButtons();
  render();
  showToast('Redid change');
}
document.getElementById('undoBtn').onclick = undoLast;
document.getElementById('redoBtn').onclick = redoLast;

  }
  function findOrCreateChild(parentId, name, icon){
    let f = folders.find(x => x.parentId === parentId && x.name === name);
    if(!f){ f = { id: uid(), name, parentId, icon: icon || null }; folders.push(f); }

  findOrCreateChild(hairTreat.id, 'Oils');

  findOrCreateChild(skin.id, 'Toners and Essences', 'sc_toners');

  findOrCreateChild(skin.id, 'Moisturizers', 'sc_moisturizers');
  findOrCreateChild(skin.id, 'Sunscreen', 'sc_sunscreen');
  findOrCreateChild(skin.id, 'Masks and Exfoliators', 'sc_masks');

  const makeup = findOrCreateTop('Makeup', 'makeup');
  const mkFace = findOrCreateChild(makeup.id, 'Face', 'mk_face');
  findOrCreateChild(mkFace.id, 'Primers');
  findOrCreateChild(mkFace.id, 'Foundations');
  findOrCreateChild(mkFace.id, 'Concealers');
  findOrCreateChild(mkFace.id, 'Setting Powders');
  const mkCheeks = findOrCreateChild(makeup.id, 'Cheeks', 'mk_cheeks');
  findOrCreateChild(mkCheeks.id, 'Blushes');
  findOrCreateChild(mkCheeks.id, 'Bronzers and Contours');

// ---------- Helpers ----------
function directChildFolders(parentId){
  return folders.filter(f => f.parentId === parentId);
}
function directProducts(folderId){
  return products.filter(p => p.folderId === folderId);
}
function collectDescendantProducts(folderId){
  let list = directProducts(folderId);
  for(const sub of directChildFolders(folderId)){
    list = list.concat(collectDescendantProducts(sub.id));
  }
  return list;
}
// Folder tile badges always show counts matching the active filter (if any),
// regardless of whether the main list is scoped to this folder only or
// this folder + subfolders.
function countRecursive(folderId){
  return filterProducts(collectDescendantProducts(folderId)).length;
}
function pathTo(folderId){
  const path = [];
  let f = folders.find(x=>x.id===folderId);
  while(f){ path.unshift(f); f = folders.find(x=>x.id===f.parentId); }
  return path;
}
function fmtDate(str){
  if(!str) return '';
  const d = new Date(str+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
}
function fmtDateTime(ts){
  if(!ts) return '';
  return new Date(ts).toLocaleString(undefined,{month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}
// If no explicit expiration date is set but a manufacturing date is, assume
// a 3-year shelf life from manufacturing so every item can still be tracked.
function effectiveExp(p){
  if(p.expDate) return { date: p.expDate, estimated: false };
  if(p.mfgDate){
    const d = new Date(p.mfgDate+'T00:00:00');
    d.setFullYear(d.getFullYear() + 3);
    return { date: d.toISOString().slice(0,10), estimated: true };
  }
  return null;
}
function expiryInfo(p){
  const eff = effectiveExp(p);
  if(!eff) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(eff.date+'T00:00:00');
  const days = Math.round((exp - today)/86400000);
  const est = eff.estimated ? ' · est.' : '';
  if(days < 0) return {cls:'expired', label:'Expired' + est};
  if(days <= 30) return {cls:'soon', label: (days===0 ? 'Expires today' : `Expires in ${days}d`) + est};
  return {cls:'ok', label: 'Exp ' + fmtDate(eff.date) + est};
}

// ---------- Rendering ----------
function render(){
  renderCrumbs();
  renderGrid();
  sortLabelEl.textContent = SORT_LABELS[sortMode];
  gridEl.classList.toggle('list-view', viewMode === 'list');
  document.getElementById('gridViewBtn').classList.toggle('active', viewMode === 'grid');
  document.getElementById('listViewBtn').classList.toggle('active', viewMode === 'list');
  updateFilterLabel();
  window.scrollTo(0, 0);
}

function updateFilterLabel(){
  let label = 'Filter';
  if(filterMode.type === 'using') label = 'Using';
  else if(filterMode.type === 'expired') label = 'Expired';
  else if(filterMode.type === 'soon') label = `≤${filterMode.days}d`;
  if(filterMode.scope === 'recursive') label += ' ·all';
  filterLabelEl.textContent = label;
  filterBtnEl.classList.toggle('active', filterMode.type !== 'all' || filterMode.scope === 'recursive');
}

document.getElementById('viewToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('.view-btn');
  if(!btn) return;
  const mode = btn.getAttribute('data-view');
  if(mode === viewMode) return;
  viewMode = mode;
  saveViewMode();
  render();
});

function renderCrumbs(){
  const path = pathTo(currentFolderId);
  let html = `<span class="crumb ${currentFolderId===null?'current':''}" data-nav="root">All Products</span>`;
  path.forEach(f=>{
    html += `<span class="sep">/</span><span class="crumb ${f.id===currentFolderId?'current':''}" data-nav="${f.id}">${escapeHtml(f.name)}</span>`;
  });
  crumbsEl.innerHTML = html;
  crumbsEl.querySelectorAll('.crumb').forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute('data-nav');
      currentFolderId = id==='root' ? null : id;
      render();
    };
  });
}

function sortedProducts(list){
  const arr = [...list];
  if(sortMode==='name') arr.sort((a,b)=> a.name.localeCompare(b.name));
  else if(sortMode==='purchased') arr.sort((a,b)=> (b.purchaseDate||'').localeCompare(a.purchaseDate||''));
  else if(sortMode==='expiry') arr.sort((a,b)=>{
    const ea = effectiveExp(a), eb = effectiveExp(b);
    if(!ea && !eb) return 0;
    if(!ea) return 1;
    if(!eb) return -1;
    return ea.date.localeCompare(eb.date);
  });
  else arr.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  return arr;
}

function filterProducts(list){
  if(filterMode.type === 'all') return list;
  if(filterMode.type === 'using') return list.filter(p => p.inUse);
  if(filterMode.type === 'expired') return list.filter(p => {
    const info = expiryInfo(p);
    return info && info.cls === 'expired';
  });
  if(filterMode.type === 'soon') return list.filter(p => {
    const eff = effectiveExp(p);
    if(!eff) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    const exp = new Date(eff.date+'T00:00:00');
    const days = Math.round((exp - today)/86400000);
    return days <= (filterMode.days || 14);
  });
  return list;
}

function renderGrid(){
  const subFolders = directChildFolders(currentFolderId).sort((a,b)=>a.name.localeCompare(b.name));
  const rawItems = filterMode.scope === 'recursive' ? collectDescendantProducts(currentFolderId) : directProducts(currentFolderId);
  const items = sortedProducts(filterProducts(rawItems));
  const filtered = filterMode.type !== 'all';
  countLabel.textContent = `${subFolders.length} folder${subFolders.length!==1?'s':''} · ${items.length} item${items.length!==1?'s':''}`;

  if(subFolders.length===0 && items.length===0){
    gridEl.innerHTML = `<div class="empty-state">
      <div class="big">${filtered ? 'No matches' : 'Nothing here yet'}</div>
      <div>${filtered ? 'Nothing in this folder matches that filter.' : 'Tap + to add your first product or folder.'}</div>
    </div>`;
    return;
  }

  let html = '';
  subFolders.forEach(f=>{
    const c = countRecursive(f.id);
    html += `<div class="tile folder-tile" data-folder="${f.id}">
      ${folderIconMarkup(f)}
      <div class="folder-name">${escapeHtml(f.name)}</div>
      <div class="folder-meta">${c} item${c!==1?'s':''}</div>
      <div class="tile-menu-btn" data-folder-menu="${f.id}">⋯</div>
    </div>`;
  });
  items.forEach(p=>{
    const info = expiryInfo(p);
    const photo = p.image
      ? `<img class="product-photo" src="${p.image}">`
      : `<div class="product-photo placeholder">✿</div>`;
    const qty = (p.quantity===0 || p.quantity) ? p.quantity : 1;
    html += `<div class="tile product-tile" data-product="${p.id}">
      ${photo}
      <div class="product-body">
        <div class="product-name">${escapeHtml(p.name)}</div>
        <div class="product-sub">Qty ${qty} ${p.purchaseDate ? '· Bought ' + fmtDate(p.purchaseDate) : ''}</div>
        <div style="display:flex; flex-wrap:wrap; gap:5px;">
          ${p.inUse ? `<div class="badge using">In use</div>` : ''}
          ${info ? `<div class="badge ${info.cls}">${info.label}</div>` : ''}
        </div>
        <div class="updated-label">Updated ${fmtDateTime(p.updatedAt || p.createdAt)}</div>
      </div>
    </div>`;
  });
  gridEl.innerHTML = html;

  gridEl.querySelectorAll('[data-folder]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('[data-folder-menu]')) return;
      currentFolderId = el.getAttribute('data-folder');
      render();
    };
  });
  gridEl.querySelectorAll('[data-folder-menu]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openFolderSheet(el.getAttribute('data-folder-menu')); };
  });
  gridEl.querySelectorAll('[data-product]').forEach(el=>{
    el.onclick = ()=> openProductSheet(el.getAttribute('data-product'));
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Backup & Restore ----------
function todayStamp(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function exportBackup(){
  const payload = {
    app: 'vanity-beauty-tracker',
    version: 1,
    exportedAt: new Date().toISOString(),
    folders,
    products
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `vanity-backup-${todayStamp()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

async function applyBackup(data){
  pushUndo();
  const priorProductIds = products.map(p=>p.id);
  const importedFolders = Array.isArray(data.folders) ? data.folders : [];
  const importedProducts = Array.isArray(data.products) ? data.products : [];

  folders = importedFolders.map(f => ({
    id: f.id || uid(), name: f.name || 'Untitled', parentId: f.parentId || null, icon: f.icon || null
  }));
  products = importedProducts.map(p => ({
    id: p.id || uid(),
    name: p.name || 'Untitled',
    folderId: p.folderId || null,
    image: p.image || null,
    quantity: (p.quantity===0 || p.quantity) ? p.quantity : 1,
    inUse: !!p.inUse,
    purchaseDate: p.purchaseDate || null,
    mfgDate: p.mfgDate || null,
    expDate: p.expDate || null,
    notes: p.notes || '',
    createdAt: p.createdAt || Date.now(),
    updatedAt: p.updatedAt || Date.now()
  }));

  await persistFullState(priorProductIds);
  currentFolderId = null;
}

function openMenuSheet(){
  openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Backup &amp; Restore</div>
    <div class="action-item" id="exportAction"><div class="action-icon">⬇</div>Export backup (.json)</div>
    <div class="action-item" id="importAction"><div class="action-icon">⬆</div>Restore from backup</div>
    <input type="file" accept="application/json,.json" id="importFileInput" style="display:none;">
    <div class="photo-hint" style="margin-top:10px;">Exports include all your folders, products, photos, and notes. Restoring replaces everything currently in the app.</div>
  `);
  document.getElementById('exportAction').onclick = ()=>{
    exportBackup();
    closeOverlay();
  };
  const fileInput = document.getElementById('importFileInput');
  document.getElementById('importAction').onclick = ()=> fileInput.click();
  fileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      let data;
      try{ data = JSON.parse(ev.target.result); }
      catch(err){ alert("That file couldn't be read — it doesn't look like a valid backup."); return; }
      if(!data || (!Array.isArray(data.folders) && !Array.isArray(data.products))){
        alert("That file doesn't look like a Vanity backup.");
        return;
      }
      if(!confirm('This will replace everything currently in the app with this backup. Continue?')) return;
      await applyBackup(data);
      closeOverlay();
      render();
    };
    reader.readAsText(file);
  };
}
document.getElementById('menuBtn').onclick = openMenuSheet;

// ---------- Folder sheet (add/edit/delete) ----------
function openFolderSheet(folderId){
  const editing = folderId ? folders.find(f=>f.id===folderId) : null;
  openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">${editing ? 'Edit folder' : 'New folder'}</div>
    <label class="field-label">Folder</label>
    <input type="search" id="folderTitleInput" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" placeholder="e.g. Skincare" value="${editing ? escapeHtml(editing.name) : ''}">
    <label class="field-label">Icon</label>
    <div class="icon-picker" id="iconPicker">
      <button type="button" class="icon-swatch ${!(editing && editing.icon) ? 'selected' : ''}" data-icon="" title="No icon"><div class="no-icon-mark"></div></button>
      ${ICON_LIBRARY.map(ic => `<button type="button" class="icon-swatch ${editing && editing.icon===ic.key ? 'selected' : ''}" data-icon="${ic.key}" title="${ic.label}">${FOLDER_ICONS[ic.key]}</button>`).join('')}
    </div>
    <div class="sheet-actions">
      ${editing ? '<button class="btn btn-danger" id="deleteFolderBtn">Delete</button>' : '<button class="btn btn-secondary" id="cancelFolderBtn">Cancel</button>'}
      <button class="btn btn-primary" id="saveFolderBtn">Save</button>
    </div>
  `);
  const nameInput = document.getElementById('folderTitleInput');
  nameInput.focus();
  let selectedIcon = editing && editing.icon ? editing.icon : null;
  const iconPicker = document.getElementById('iconPicker');
  iconPicker.querySelectorAll('.icon-swatch').forEach(btn=>{
    btn.onclick = ()=>{
      selectedIcon = btn.getAttribute('data-icon') || null;
      iconPicker.querySelectorAll('.icon-swatch').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
    };
  });
  const cancelBtn = document.getElementById('cancelFolderBtn');
  if(cancelBtn) cancelBtn.onclick = closeOverlay;
  const delBtn = document.getElementById('deleteFolderBtn');
  if(delBtn) delBtn.onclick = async ()=>{
    const childFolderCount = folders.filter(f=>f.parentId===folderId).length;
    const childProductCount = products.filter(p=>p.folderId===folderId).length;
    if(childFolderCount || childProductCount){
      if(!confirm(`This folder contains ${childProductCount} product(s) and ${childFolderCount} subfolder(s). Delete anyway? Items inside will move to the parent folder.`)) return;
      pushUndo();
      const parentId = editing.parentId;
      folders.filter(f=>f.parentId===folderId).forEach(f=> f.parentId = parentId);
      products.filter(p=>p.folderId===folderId).forEach(p=> p.folderId = parentId);
      await Promise.all(products.filter(p=>folders.some(()=>false)).map(()=>Promise.resolve()));
      for(const p of products.filter(p=>p.folderId===parentId)) await saveProduct(p);
    } else {
      pushUndo();
    }
    folders = folders.filter(f=>f.id!==folderId);
    await saveFolders();
    if(currentFolderId===folderId) currentFolderId = editing.parentId;
    closeOverlay(); render();
    showToast('Folder deleted');
  };
  document.getElementById('saveFolderBtn').onclick = async ()=>{
    const name = nameInput.value.trim();
    if(!name){ nameInput.focus(); return; }
    pushUndo();
    if(editing){
      editing.name = name;
      editing.icon = selectedIcon;
    } else {
      folders.push({ id: uid(), name, parentId: currentFolderId, icon: selectedIcon });
    }
    await saveFolders();
    closeOverlay(); render();
  };
}

// ---------- Product sheet (add/edit/delete) ----------
function allFolderOptions(){
  // returns [{id, label}] with indentation showing nesting, id null = root
  const opts = [{id:'', label:'All Products (root)'}];
  function walk(parentId, depth){
    directChildFolders(parentId).sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>{
      opts.push({ id:f.id, label: '　'.repeat(depth) + f.name });
      walk(f.id, depth+1);
    });
  }
  walk(null, 0);
  return opts;
}

function openProductSheet(productId){
  const editing = productId ? products.find(p=>p.id===productId) : null;
  const folderOpts = allFolderOptions();
  const selectedFolder = editing ? editing.folderId : currentFolderId;

  openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">${editing ? 'Edit product' : 'New product'}</div>

    <div class="photo-row">
      <div class="photo-picker" id="photoPicker">
        ${editing && editing.image ? `<img src="${editing.image}">` : `<div class="plus-icon">＋</div><div>Photo</div>`}
        <input type="file" accept="image/*" id="photoInput" style="display:none;">
      </div>
      <div class="photo-hint">Tap the square to add a photo</div>
    </div>

    <label class="field-label">Product</label>
    <input type="search" id="productTitleInput" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" placeholder="e.g. Vitamin C Serum" value="${editing ? escapeHtml(editing.name) : ''}">

    <div class="date-row">
      <div>
        <label class="field-label">Folder</label>
        <select id="folderSelect">
          ${folderOpts.map(o=>`<option value="${o.id}" ${String(selectedFolder||'')===o.id ? 'selected':''}>${escapeHtml(o.label)}</option>`).join('')}
        </select>
      </div>
      <div style="flex: 0 0 84px;">
        <label class="field-label">Qty</label>
        <input type="text" inputmode="numeric" id="qtyInput" autocomplete="off" value="${editing && (editing.quantity===0 || editing.quantity) ? editing.quantity : 1}">
      </div>
    </div>

    <div class="toggle-row">
      <span>Currently using</span>
      <button type="button" class="toggle-switch ${editing && editing.inUse ? 'on' : ''}" id="inUseToggle"></button>
    </div>

    <div class="date-row">
      <div>
        <label class="field-label">Purchased on</label>
        <input type="date" id="purchaseInput" autocomplete="off" value="${editing?.purchaseDate || ''}">
      </div>
      <div>
        <label class="field-label">Manufactured on</label>
        <input type="date" id="mfgInput" autocomplete="off" value="${editing?.mfgDate || ''}">
      </div>
    </div>
    <label class="field-label">Expiration date</label>
    <input type="date" id="expInput" autocomplete="off" value="${editing?.expDate || ''}">

    <label class="field-label">Notes</label>
    <textarea id="notesInput" autocomplete="off" placeholder="Shade, where you bought it, how it's working out...">${editing ? escapeHtml(editing.notes||'') : ''}</textarea>

    <div class="sheet-actions">
      ${editing ? '<button class="btn btn-danger" id="deleteProductBtn">Delete</button>' : '<button class="btn btn-secondary" id="cancelProductBtn">Cancel</button>'}
      <button class="btn btn-primary" id="saveProductBtn">Save</button>
    </div>
  `);

  let inUseValue = !!(editing && editing.inUse);
  const inUseToggle = document.getElementById('inUseToggle');
  inUseToggle.onclick = ()=>{
    inUseValue = !inUseValue;
    inUseToggle.classList.toggle('on', inUseValue);
  };

  let pendingImage = editing ? (editing.image || null) : null;
  const picker = document.getElementById('photoPicker');
  const fileInput = document.getElementById('photoInput');

  function setPickerImage(dataUrl){
    pendingImage = dataUrl;
    picker.innerHTML = `<img src="${dataUrl}">`;
  }

  function openPhotoMenu(){
    photoMenuOverlay.innerHTML = `
      <div class="sheet" style="max-width:560px;">
        <div class="sheet-handle"></div>
        <div class="sheet-title">Add a photo</div>
        <div class="action-item" id="pmLibrary"><div class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5.5-5.5a2 2 0 0 0-2.8 0L4 19"/></svg></div>Photo Library</div>
        <div class="action-item" id="pmCamera"><div class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-2h7l1 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg></div>Take Photo</div>
        <div class="action-item" id="pmBarcode"><div class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 5v14M7.5 5v14M10.5 5v14M13 5v14M16.5 5v14M20 5v14"/></svg></div>Scan Barcode</div>
        <div class="action-item" id="pmFiles"><div class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg></div>Choose a File</div>
      </div>
    `;
    photoMenuOverlay.classList.remove('hidden');
    photoMenuOverlay.onclick = (e)=>{ if(e.target===photoMenuOverlay) closePhotoMenu(); };
    document.getElementById('pmLibrary').onclick = ()=>{ closePhotoMenu(); fileInput.removeAttribute('capture'); fileInput.click(); };
    document.getElementById('pmFiles').onclick = ()=>{ closePhotoMenu(); fileInput.removeAttribute('capture'); fileInput.click(); };
    document.getElementById('pmCamera').onclick = ()=>{ closePhotoMenu(); fileInput.setAttribute('capture','environment'); fileInput.click(); };
    document.getElementById('pmBarcode').onclick = ()=>{
      closePhotoMenu();
      openBarcodeScanner({ onResult: (code)=> handleScannedBarcode(code) });
    };
  }
  function closePhotoMenu(){ photoMenuOverlay.classList.add('hidden'); photoMenuOverlay.innerHTML = ''; }

  async function handleScannedBarcode(code){
    showToast('Looking up product…');
    try{
      const data = await lookupBarcodeProduct(code);
      if(data && data.status === 1 && data.product){
        const p = data.product;
        if(p.product_name){
          const titleInput = document.getElementById('productTitleInput');
          if(titleInput) titleInput.value = p.product_name;
        }
        const imgUrl = p.image_front_url || p.image_url || p.image_small_url;
        if(imgUrl){
          try{
            setPickerImage(await fetchImageAsResizedDataUrl(imgUrl));
          }catch(imgErr){ /* couldn't fetch photo — name still filled in */ }
        }
        showToast('Filled in from barcode');
      } else {
        showToast("Barcode not found — add details manually");
      }
    }catch(err){
      showToast("Couldn't look up that barcode");
    }
  }

  picker.onclick = ()=> openPhotoMenu();
  fileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 600;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        setPickerImage(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const cancelBtn = document.getElementById('cancelProductBtn');
  if(cancelBtn) cancelBtn.onclick = closeOverlay;

  const delBtn = document.getElementById('deleteProductBtn');
  if(delBtn) delBtn.onclick = async ()=>{
    if(!confirm('Delete this product?')) return;
    pushUndo();
    products = products.filter(p=>p.id!==productId);
    await deleteProductStorage(productId);
    await saveProductIndex();
    closeOverlay(); render();
    showToast('Product deleted');
  };

  document.getElementById('saveProductBtn').onclick = async ()=>{
    const name = document.getElementById('productTitleInput').value.trim();
    if(!name){ document.getElementById('productTitleInput').focus(); return; }
    pushUndo();
    const folderVal = document.getElementById('folderSelect').value || null;
    let quantity = parseInt(document.getElementById('qtyInput').value, 10);
    if(isNaN(quantity) || quantity < 0) quantity = 1;
    const purchaseDate = document.getElementById('purchaseInput').value || null;
    const mfgDate = document.getElementById('mfgInput').value || null;
    const expDate = document.getElementById('expInput').value || null;
    const notes = document.getElementById('notesInput').value.trim();
    const now = Date.now();

    if(editing){
      editing.name = name;
      editing.folderId = folderVal;
      editing.quantity = quantity;
      editing.inUse = inUseValue;
      editing.purchaseDate = purchaseDate;
      editing.mfgDate = mfgDate;
      editing.expDate = expDate;
      editing.notes = notes;
      editing.image = pendingImage;
      editing.updatedAt = now;
      await saveProduct(editing);
    } else {
      const p = {
        id: uid(), name, folderId: folderVal, quantity, inUse: inUseValue,
        purchaseDate, mfgDate, expDate, notes,
        image: pendingImage, createdAt: now, updatedAt: now
      };
      products.push(p);
      await saveProduct(p);
      await saveProductIndex();
    }
    closeOverlay(); render();
  };
}

  render();
